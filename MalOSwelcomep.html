<!doctype html>
<html lang="en">
  <head>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .close-button {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: #3d3a3a;
        color: #f4f2ef;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #1d1c1c;
        color: #f4f2ef;
        font-family: "IBM Plex Sans", Arial, sans-serif;
      }

      .window {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(1100px, calc(100% - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: #1d1c1c;
        border: 1px solid #3d3a3a;
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
        transform: translate(-50%, -50%);
      }

      .page {
        width: 100%;
        min-height: auto;
        padding: 0 24px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      .drag-handle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 32px 0;
        border-bottom: 1px solid #3d3a3a;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .logo {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .status {
        color: #aaa6a2;
        font-size: 0.85rem;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 64px;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #aaa6a2;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.92;
      }

      .intro {
        max-width: 540px;
        margin: 28px 0 0;
        color: #bbb7b3;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .art {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 520px;
        border: 1px solid #3d3a3a;
        border-radius: 50%;
        background: #242222;
      }

      .art img {
        display: block;
        width: min(90%, 480px);
        height: auto;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0 32px;
        border-top: 1px solid #3d3a3a;
        color: #77736f;
        font-size: 0.8rem;
      }

      @media (max-width: 760px) {
        .page {
          padding: 0 16px;
        }

        .drag-handle {
          padding: 24px 0;
        }

        main {
          grid-template-columns: 1fr;
          gap: 48px;
          padding: 56px 0;
        }

        .art {
          min-height: auto;
          aspect-ratio: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="window" id="welcome-window">
      <button
        class="close-button"
        type="button"
        aria-label="Close welcome window"
      >
        &times;
      </button>
      <div class="page">
        <header class="drag-handle">
          <p class="logo">malOS</p>
          <span class="status">cookies n crean</span>
        </header>

        <main>
          <section>
            <p class="eyebrow">Welcome to my OS</p>
            <h1>Lock in.<br />Focus.</h1>
            <p class="intro">
              A simple operating system made for people who prefer no fun or
              flavor.
            </p>
          </section>

          <div class="art">
            <img src="./planet.png.png" alt="Line drawing of a planet" />
          </div>
        </main>

        <footer>
          <span>hellllloooooo!</span>
          <span>malOS</span>
        </footer>
      </div>
    </div>

    <script>
      function updatetime() {
        var currentime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentime;
      }

      setInterval(updatetime, 1000);
    </script>

    <p
      id="timeElement"
      style="font-size: 24px; color: white; font-weight: bold; text-align: end"
    >
      Time
    </p>

    <div
      style="
        display: flex;
        justify-content: space-between;
        text-align: start;
        padding: 0 20px;
      "
    >
      <p
        style="
          position: fixed;
          top: 20px;
          left: 20px;
          font-size: 12px;
          color: white;
          font-weight: bold;
        "
      >
        MalOS
      </p>
    </div>

    <p class="icon-ting open-button" data-window="welcome-window">
      <img src="./planet.png.png" alt="Line drawing of a planet" width="50" />
      <span>MalOS</span>
    </p>

    <style>
      .icon-ting {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-left: 20px;
        color: white;
        cursor: pointer;
      }
    </style>
    <script>
      let topWindowLevel = 1;

      document.querySelectorAll(".open-button").forEach(function (button) {
        button.addEventListener("click", function () {
          var windowId = button.dataset.window;
          var windowElement = document.getElementById(windowId);

          windowElement.style.display = "block";
          topWindowLevel += 1;
          windowElement.style.zIndex = topWindowLevel;
        });
      });

      document.querySelectorAll(".close-button").forEach(function (button) {
        button.addEventListener("click", function () {
          var windowElement = button.closest(".window");
          windowElement.style.display = "none";
        });
      });

      document.querySelectorAll(".window").forEach(function (windowElement) {
        var dragHandle = windowElement.querySelector(".drag-handle");
        var offsetX = 0;
        var offsetY = 0;

        if (!dragHandle) {
          return;
        }

        dragHandle.addEventListener("pointerdown", function (event) {
          var bounds = windowElement.getBoundingClientRect();

          topWindowLevel += 1;
          windowElement.style.zIndex = topWindowLevel;
          windowElement.style.left = bounds.left + "px";
          windowElement.style.top = bounds.top + "px";
          windowElement.style.transform = "none";
          offsetX = event.clientX - bounds.left;
          offsetY = event.clientY - bounds.top;
          dragHandle.setPointerCapture(event.pointerId);
        });

        dragHandle.addEventListener("pointermove", function (event) {
          if (!dragHandle.hasPointerCapture(event.pointerId)) {
            return;
          }

          windowElement.style.left = event.clientX - offsetX + "px";
          windowElement.style.top = event.clientY - offsetY + "px";
        });

        dragHandle.addEventListener("pointerup", function (event) {
          dragHandle.releasePointerCapture(event.pointerId);
        });
      });
    </script>
  </body>
</html>
