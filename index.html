<!doctype html>
<html lang="en">
  <head>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .close-button {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: #3d3a3a;
        color: #f4f2ef;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #1d1c1c;
        color: #f4f2ef;
        font-family: "IBM Plex Sans", Arial, sans-serif;
      }

      .window {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(1100px, calc(100% - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: #1d1c1c;
        border: 1px solid #3d3a3a;
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
        transform: translate(-50%, -50%);
      }

      .page {
        width: 100%;
        min-height: auto;
        padding: 0 24px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      .drag-handle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 32px 0;
        border-bottom: 1px solid #3d3a3a;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .logo {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .status {
        color: #aaa6a2;
        font-size: 0.85rem;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 64px;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #aaa6a2;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.92;
      }

      .intro {
        max-width: 540px;
        margin: 28px 0 0;
        color: #bbb7b3;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .art {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 520px;
        border: 1px solid #3d3a3a;
        border-radius: 50%;
        background: #242222;
      }

      .art img {
        display: block;
        width: min(90%, 480px);
        height: auto;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0 32px;
        border-top: 1px solid #3d3a3a;
        color: #77736f;
        font-size: 0.8rem;
      }

      @media (max-width: 760px) {
        .page {
          padding: 0 16px;
        }

        .drag-handle {
          padding: 24px 0;
        }

        main {
          grid-template-columns: 1fr;
          gap: 48px;
          padding: 56px 0;
        }

        .art {
          min-height: auto;
          aspect-ratio: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="window" id="welcome-window" style="display: none">
      <button
        class="close-button"
        type="button"
        aria-label="Close welcome window"
      >
        &times;
      </button>
      <div class="page">
        <header class="drag-handle">
          <p class="logo">MalOS</p>
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgMjdtkS3zSrD5etdcWKic7dM6WjVIXyM85K9euH9l9w&s=10"
            width="60"
            style="display: block; margin-right: auto"
          />
          <span class="status">cookies n cream</span>
        </header>

        <main>
          <section>
            <p class="eyebrow">Welcome to my OS</p>
            <h1>Lock in.<br />Focus.</h1>
            <p class="intro">
              A simple operating system made for people who prefer no fun or
              flavor.
            </p>
          </section>

          <div class="art">
            <img src="./planet.png.png" alt="Line drawing of a planet" />
          </div>
        </main>

        <footer>
          <span>hellllloooooo!</span>
          <span>MalOS</span>
        </footer>
      </div>
    </div>

    <script>
      function updatetime() {
        var currentime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentime;
      }

      setInterval(updatetime, 1000);
    </script>

    <p
      id="timeElement"
      style="font-size: 24px; color: white; font-weight: bold; text-align: end"
    >
      Time
    </p>

    <img
      src="./eye.png"
      alt="Eye"
      draggable="false"
      width="700"
      style="
        position: fixed;
        top: 40px;
        right: 100px;
        z-index: 0;
        user-select: none;
        pointer-events: none;
        filter: brightness(50%);
      "
    />
    <div
      style="
        display: flex;
        justify-content: space-between;
        text-align: start;
        padding: 0 20px;
      "
    >
      <p
        style="
          position: fixed;
          top: 20px;
          left: 20px;
          font-size: 12px;
          color: white;
          font-weight: bold;
        "
      >
        MalOS
      </p>
    </div>

    <p class="icon-ting open-button" data-window="welcome-window">
      <img src="./planet.png.png" alt="Line drawing of a planet" width="50" />
      <span>MalOS</span>
    </p>

    <p class="icon-ting open-button" data-window="minky-window">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzijJIwT8GNKLd2Nr9JQtk4oG75MmawPb3Ka60dKX7WQ&s=10"
        alt="Minky"
        width="40"
      />
      <span>Minky</span>
    </p>

    <div class="window" id="minky-window" style="display: none">
      <button
        class="close-button"
        type="button"
        aria-label="Close Minky window"
      >
        &times;
      </button>

      <div class="page">
        <header class="drag-handle">
          <span class="status">minky</span>
        </header>
        <div class="minky-gallery">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTW9ZwC6TboSulNYUwsx4ggrNehb9Fc_GtaAvtaLYMPug&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRabS3qy4AQ1QT551pbylTVtHY8vgTCpvjI3NE-G2HL6A&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQK0vXM3G4C_ML9tG2zFUULrJlPW_n8WtmCiB1KUr9ulQ&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5CqCFXYI4bNGssJXjljO5jFa6m_FYncfZ_fSuoU-oAA&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAi0oKE1KyaGT5U3RGzJTb9DmSNGvwvO0HMlwnxdg4LA&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmD8ZaJ2DCO_RgAPaDcnZxc7ERqRRaXOZIKdSuFKJLww&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ60xG8SE6d89tspNmZNVgoDIn-OA2okfIilyMYs4WBA&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7wn0Dtb7fPnHSdYo1BL9awbEAwB2Q_yRO4Mo-9IM8SA&s"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqDE0CxiGmcdmX3sukBqXmrqj9YcKqNCWgU4-alw0NGg&s"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2JYwDXZb-dgImVR1g4DSEVC2z2ZZcTkLCtbZqFsiM4g&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnILJQzEmCxZnnMNg-_7c-1XEYi4a2TRCliCb7boU_8w&s=10"
            alt="Minky gallery image"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuV5CG8T_-toHBal7t26E50n1XcP8e9Wtwezytoy2qQA&s=10"
            alt="Minky gallery image"
          />
        </div>

        <div class="minky-tracks" hidden>
          <audio class="window-audio braces-audio" preload="metadata">
            <source
              src="./fakemink - Braces (Prod Suzy Sheer) - fakemink (128k).mp3"
              type="audio/mpeg"
            />
          </audio>
          <audio class="window-audio" preload="metadata">
            <source
              src="./fakemink - Easter Pink (Prod Suzy Sheer) - fakemink (128k).mp3"
              type="audio/mpeg"
            />
          </audio>
        </div>
      </div>
    </div>

    <style>
      .icon-ting {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: fit-content;
        gap: 5px;
        margin-left: 20px;
        color: white;
        cursor: pointer;
      }

      .minky-gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
        padding: 24px 0;
      }

      .minky-gallery img {
        display: block;
        width: 100%;
        height: auto;
      }

      .minky-gallery img:nth-child(3n + 1) {
        filter: saturate(250%) contrast(140%) hue-rotate(35deg);
      }

      .minky-gallery img:nth-child(3n + 2) {
        filter: sepia(90%) saturate(300%) hue-rotate(165deg) contrast(125%);
      }

      .minky-gallery img:nth-child(3n) {
        filter: grayscale(100%) invert(85%) contrast(180%);
      }

      @media (max-width: 650px) {
        .minky-gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <script>
      let topWindowLevel = 1;
      var minkyAudioContext;
      var minkyAudioGains = new WeakMap();

      function prepareMinkyAudio(audio) {
        if (!minkyAudioContext) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          minkyAudioContext = new AudioContext();
        }

        if (!minkyAudioGains.has(audio)) {
          var source = minkyAudioContext.createMediaElementSource(audio);
          var gain = minkyAudioContext.createGain();

          gain.gain.value = audio.classList.contains("braces-audio") ? 1.8 : 1;
          source.connect(gain);
          gain.connect(minkyAudioContext.destination);
          minkyAudioGains.set(audio, gain);
        }
      }

      document.querySelectorAll(".open-button").forEach(function (button) {
        button.addEventListener("click", function () {
          var windowId = button.dataset.window;
          var windowElement = document.getElementById(windowId);

          windowElement.style.display = "block";

          windowElement
            .querySelectorAll(".window-audio")
            .forEach(function (audio) {
              prepareMinkyAudio(audio);
              minkyAudioContext.resume();
              audio.currentTime = 0;
              audio.play().catch(function () {
                // Some browsers may require the user to press a play button.
              });
            });

          topWindowLevel += 1;
          windowElement.style.zIndex = topWindowLevel;
        });
      });

      document.querySelectorAll(".close-button").forEach(function (button) {
        button.addEventListener("click", function () {
          var windowElement = button.closest(".window");

          windowElement
            .querySelectorAll(".window-audio")
            .forEach(function (audio) {
              audio.pause();
              audio.currentTime = 0;
            });

          windowElement.style.display = "none";
        });
      });

      document.querySelectorAll(".window").forEach(function (windowElement) {
        var dragHandle = windowElement.querySelector(".drag-handle");
        var offsetX = 0;
        var offsetY = 0;

        if (!dragHandle) {
          return;
        }

        dragHandle.addEventListener("pointerdown", function (event) {
          var bounds = windowElement.getBoundingClientRect();

          topWindowLevel += 1;
          windowElement.style.zIndex = topWindowLevel;
          windowElement.style.left = bounds.left + "px";
          windowElement.style.top = bounds.top + "px";
          windowElement.style.transform = "none";
          offsetX = event.clientX - bounds.left;
          offsetY = event.clientY - bounds.top;
          dragHandle.setPointerCapture(event.pointerId);
        });

        dragHandle.addEventListener("pointermove", function (event) {
          if (!dragHandle.hasPointerCapture(event.pointerId)) {
            return;
          }

          windowElement.style.left = event.clientX - offsetX + "px";
          windowElement.style.top = event.clientY - offsetY + "px";
        });

        dragHandle.addEventListener("pointerup", function (event) {
          dragHandle.releasePointerCapture(event.pointerId);
        });
      });
    </script>
  </body>
</html>
