<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>malOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #1d1c1c;
        color: #f4f2ef;
        font-family: "IBM Plex Sans", Arial, sans-serif;
      }

      .page {
        width: min(1100px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 32px 0;
        border-bottom: 1px solid #3d3a3a;
      }

      .logo {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .status {
        color: #aaa6a2;
        font-size: 0.85rem;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 64px;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #aaa6a2;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.92;
      }

      .intro {
        max-width: 540px;
        margin: 28px 0 0;
        color: #bbb7b3;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .art {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 420px;
        border: 1px solid #3d3a3a;
        border-radius: 50%;
        background: #242222;
      }

      .art img {
        display: block;
        width: min(90%, 480px);
        height: auto;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0 32px;
        border-top: 1px solid #3d3a3a;
        color: #77736f;
        font-size: 0.8rem;
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 32px, 1100px);
        }

        header {
          padding: 24px 0;
        }

        main {
          grid-template-columns: 1fr;
          gap: 48px;
          padding: 56px 0;
        }

        .art {
          min-height: auto;
          aspect-ratio: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <p class="logo">malOS</p>
        <span class="status">Simple by design</span>
      </header>

      <main>
        <section>
          <p class="eyebrow">Welcome to my OS</p>
          <h1>Less flash.<br />More focus.</h1>
          <p class="intro">
            A simple operating system made for people who prefer no fun or
            flavor.
          </p>
        </section>

        <div class="art">
          <img src="./planet.png.png" alt="Line drawing of a planet" />
        </div>
      </main>

      <footer>
        <span>hello, world!</span>
        <span>malOS</span>
      </footer>
    </div>
  </body>
</html>
